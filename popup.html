<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Reels Controller</title>
    <style>
        body {
            width: 250px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 15px;
            background: #fff;
            color: #262626;
        }
        h2 {
            margin: 0 0 15px 0;
            font-size: 15px;
            text-align: center;
        }
        .controls {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
        }
        button {
            flex: 1;
            margin: 0 4px;
            padding: 8px 0;
            border: 1px solid #dbdbdb;
            background: #fafafa;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.2s;
        }
        button:hover {
            background: #efefef;
        }
        button.active {
            background: #0095f6;
            color: white;
            border-color: #0095f6;
        }
        .footer {
            font-size: 12px;
            color: #8e8e8e;
            text-align: center;
        }
    </style>
</head>
<body>
    <h2>Reels Playback Speed</h2>
    <div class="controls">
        <button data-speed="1">1×</button>
        <button data-speed="1.5">1.5×</button>
        <button data-speed="2">2×</button>
    </div>
    <div class="footer">
        ✓ Remembers your last selection
    </div>
    <script src="popup.js"></script>
</body>
</html>
